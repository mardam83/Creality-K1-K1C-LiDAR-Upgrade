# k1lidar_hook.cfg - LiDAR features at EVERY print start (Fluidd, Mainsail, API, display).
#
# Wraps SDCARD_PRINT_FILE, the command every print start goes through. When a LiDAR
# feature is enabled (LIDAR_FLOW / LIDAR_FIRSTLAYER / LIDAR_PA_APPLY) the print is
# handed to the Moonraker component [k1lidar], which reads filament and temperatures
# from the gcode, calibrates / applies the PA, checks the first layer and starts the
# real print. With everything off it is a plain pass-through.
#
# Left untouched on purpose: FIRST_FLOOR_PRINT=... (Creality's own first-layer flow,
# also used by our script - wrapping it would recurse) and ISCONTINUEPRINT=...
# (power-loss recovery).
#
# Optional (installer: --with-hook). To disable: remove [include k1lidar_hook.cfg]
# and FIRMWARE_RESTART, or turn all LiDAR features off.

[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_BASE
description: Start a print applying the LiDAR settings (flow / first layer / saved PA)
gcode:
  {% set v = printer.save_variables.variables %}
  {% set fl = v.lidar_firstlayer|default(0)|int %}
  {% set fw = v.lidar_flow|default(0)|int %}
  {% set pa = v.lidar_pa_apply|default(1)|int %}
  {% if 'FIRST_FLOOR_PRINT' in params or 'ISCONTINUEPRINT' in params %}
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% elif fl == 0 and fw == 0 and pa == 0 %}
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% else %}
    {% if printer.print_stats.state in ('printing', 'paused') %}
      {action_raise_error("print already running / stampa gia' in corso")}
    {% endif %}
    {action_call_remote_method("k1lidar_print", filename=params.FILENAME)}
    {action_respond_info("LiDAR: flow=%d first_layer=%d saved_PA=%d -> %s" % (fw, fl, pa, params.FILENAME))}
  {% endif %}
