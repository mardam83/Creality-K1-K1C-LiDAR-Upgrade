# k1lidar_hook.cfg - LiDAR features at EVERY print start (Fluidd, Mainsail, API, display).
#
# Wraps SDCARD_PRINT_FILE, the command every print start goes through. When a LiDAR
# feature is enabled (LIDAR_FLOW / LIDAR_FIRSTLAYER / LIDAR_PA_APPLY / LIDAR_ASK) the print is
# handed to the Moonraker component [k1lidar], which reads filament and temperatures
# from the gcode, calibrates / applies the PA, checks the first layer and starts the
# real print. With everything off it is a plain pass-through.
#
# Left untouched on purpose: FIRST_FLOOR_PRINT=... (Creality's own first-layer flow,
# also used by our script - wrapping it would recurse) and ISCONTINUEPRINT=...
# (power-loss recovery).
#
# With LIDAR_FLOW on, the LiDAR PA also replaces the PA written in the gcode by the
# slicer (see SET_PRESSURE_ADVANCE at the bottom).
#
# Optional (installer: --with-hook). To disable: remove [include k1lidar_hook.cfg]
# and FIRMWARE_RESTART, or turn all LiDAR features off.

[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_BASE
description: Start a print applying the LiDAR settings (flow / first layer / saved PA)
gcode:
  {% set v = printer.save_variables.variables %}
  {% set fl = v.lidar_firstlayer|default(0)|int %}
  {% set fw = v.lidar_flow|default(0)|int %}
  {% set pa = v.lidar_pa_apply|default(1)|int %}
  {% set ask = v.lidar_ask|default(0)|int %}
  {% set lk = printer['gcode_macro _LIDAR_PA_LOCK'] %}
  {% if 'FIRST_FLOOR_PRINT' in params and lk.armed|int == 1 %}
    # first-layer print started by our job: keep its PA lock (consumed here)
    SET_GCODE_VARIABLE MACRO=_LIDAR_PA_LOCK VARIABLE=armed VALUE=0
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% elif 'FIRST_FLOOR_PRINT' in params or 'ISCONTINUEPRINT' in params %}
    _LIDAR_PA_UNLOCK
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% elif fl == 0 and fw == 0 and pa == 0 and ask == 0 %}
    _LIDAR_PA_UNLOCK
    SDCARD_PRINT_FILE_BASE {rawparams}
  {% else %}
    _LIDAR_PA_UNLOCK
    {% if printer.print_stats.state in ('printing', 'paused') %}
      {action_raise_error("print already running / stampa gia' in corso")}
    {% endif %}
    {action_call_remote_method("k1lidar_print", filename=params.FILENAME)}
    {action_respond_info("LiDAR: flow=%d first_layer=%d saved_PA=%d ask=%d -> %s" % (fw, fl, pa, ask, params.FILENAME))}
  {% endif %}

# --- LiDAR PA wins over the gcode's PA ---------------------------------------------
# When LIDAR_FLOW is on (1 or 2), the print-start job sets the PA it calibrated / reused
# here. While THAT print runs, every SET_PRESSURE_ADVANCE ADVANCE=... coming from the
# gcode (slicer "Enable pressure advance", M900 K, the display's Qmode) is replaced by
# the LiDAR value. Outside a print, or with LIDAR_FLOW=0, SET_PRESSURE_ADVANCE works
# as usual. The lock is cleared at the next print start.

[gcode_macro _LIDAR_PA_LOCK]
description: internal - PA imposed by the LiDAR job on the current print (-1 = none)
variable_pa: -1.0
variable_armed: 0
variable_told: 0
gcode:
  SET_GCODE_VARIABLE MACRO=_LIDAR_PA_LOCK VARIABLE=pa VALUE={params.PA|default(-1)|float}
  SET_GCODE_VARIABLE MACRO=_LIDAR_PA_LOCK VARIABLE=armed VALUE={params.ARMED|default(0)|int}
  SET_GCODE_VARIABLE MACRO=_LIDAR_PA_LOCK VARIABLE=told VALUE=0

[gcode_macro _LIDAR_PA_UNLOCK]
description: internal - drop the LiDAR PA lock
gcode:
  _LIDAR_PA_LOCK PA=-1 ARMED=0

[gcode_macro SET_PRESSURE_ADVANCE]
rename_existing: SET_PRESSURE_ADVANCE_BASE
description: Set pressure advance (during a LiDAR-calibrated print the LiDAR PA is kept)
gcode:
  {% set lk = printer['gcode_macro _LIDAR_PA_LOCK'] %}
  {% set st = printer.print_stats.state %}
  {% if lk.pa|float >= 0 and 'ADVANCE' in params and st in ('printing', 'paused') %}
    {% if lk.told|int == 0 and (params.ADVANCE|float - lk.pa|float)|abs > 0.00005 %}
      {action_respond_info("LiDAR: PA %s from the gcode ignored, keeping LiDAR PA %.4f" % (params.ADVANCE, lk.pa|float))}
      SET_GCODE_VARIABLE MACRO=_LIDAR_PA_LOCK VARIABLE=told VALUE=1
    {% endif %}
    SET_PRESSURE_ADVANCE_BASE ADVANCE={"%.4f" % lk.pa|float}{% for k in params %}{% if k != 'ADVANCE' %} {k}={params[k]}{% endif %}{% endfor %}
  {% else %}
    SET_PRESSURE_ADVANCE_BASE {rawparams}
  {% endif %}
