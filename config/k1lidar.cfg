# k1lidar.cfg - LiDAR toolkit for Creality K1: buttons (macros) and settings.
# Every macro shows up as a button in Fluidd/Mainsail (Macros panel), with its
# description; parameters appear as input fields. LIDAR_HELP prints a short guide in
# the console (in the language chosen with LIDAR_LANGUAGE).
# The macros talk to the Moonraker component [k1lidar].
#
# Where the PA is stored: /usr/data/lidar_calib.json, one entry per FILAMENT PROFILE
# OF THE SLICER + NOZZLE TEMPERATURE (e.g. "Generic PLA" at 220 C). The profile name
# is read from the gcode (filament_settings_id): two different filaments need two
# different profiles in the slicer.
#
# Settings are persistent (stored with [save_variables], see k1lidar_vars.cfg):
#   lidar_flow        0 off | 1 calibrate new filaments only (reuse saved PA) | 2 always
#   lidar_firstlayer  0/1  LiDAR first-layer check at print start
#   lidar_on_bad      pause | cancel   what to do when the first layer is BAD
#   lidar_pa_apply    0/1  apply the saved PA of the filament to every print
#   lidar_lang        en | it
#   lidar_material / lidar_hotend / lidar_bed   fallback when the gcode does not say
#
# Requires: k1lidar_vars.cfg (or another [save_variables]) and Moonraker [k1lidar].

[gcode_macro _K1LIDAR]
description: internal - default values of the LiDAR settings
variable_defaults: {'lidar_flow': 0, 'lidar_firstlayer': 0, 'lidar_on_bad': 'pause',
                    'lidar_pa_apply': 1, 'lidar_lang': 'en',
                    'lidar_material': 'PLA', 'lidar_hotend': 0, 'lidar_bed': 0}
gcode:
  # nothing: container for the defaults

[gcode_macro _LIDAR_SAY]
description: internal - console message from the LiDAR scripts (M118 is missing on the K1)
gcode:
  {action_respond_info(params.MSG|default(''))}

[gcode_macro LIDAR_HELP]
description: Short guide to the LiDAR buttons, printed in the console
gcode:
  {% set it = printer.save_variables.variables.lidar_lang|default('en') == 'it' %}
  {% if it %}
    {action_respond_info(
      "LiDAR - guida rapida\n"
      ~ "TROVARE IL PA DI UN FILAMENTO (stampa solo un pattern di prova a X 0-30 mm, ~15 min):\n"
      ~ "  LIDAR_PA_CALIBRATE GCODE=\"file.gcode\"  -> profilo filamento e temperature presi dal gcode\n"
      ~ "  oppure FILAMENT=\"nome ESATTO del profilo nello slicer\" NOZZLE=220 BED=60 MATERIAL=PLA\n"
      ~ "PRIMA DI OGNI STAMPA (si attiva una volta, resta):\n"
      ~ "  LIDAR_FLOW MODE=1  tara i profili nuovi, per gli altri usa il PA salvato (MODE=2 sempre, 0 spento)\n"
      ~ "  LIDAR_FIRSTLAYER ON=1  controlla il primo strato (ON_BAD=cancel per annullare)\n"
      ~ "QUALE PA USA LA STAMPA: con LIDAR_FLOW attivo sempre quello LiDAR (sostituisce anche quello del gcode);\n"
      ~ "  con LIDAR_FLOW spento: 1) quello del gcode se lo slicer ha 'Enable pressure advance' attivo;\n"
      ~ "  2) altrimenti quello salvato per profilo+temperatura; 3) altrimenti quello di printer.cfg\n"
      ~ "PROFILI: LIDAR_PA_LIST elenca, LIDAR_PA_SET PA=0.027 GCODE=\"file.gcode\" assegna a mano,\n"
      ~ "  LIDAR_PA_FORGET FILAMENT=\"...\" cancella. Due filamenti diversi = due profili nello slicer.\n"
      ~ "ALTRO: LIDAR_STATUS impostazioni, LIDAR_CANCEL ferma tutto, LIDAR_LANGUAGE LANG=en")}
  {% else %}
    {action_respond_info(
      "LiDAR - quick guide\n"
      ~ "FIND THE PA OF A FILAMENT (prints only a test pattern at X 0-30 mm, ~15 min):\n"
      ~ "  LIDAR_PA_CALIBRATE GCODE=\"file.gcode\"  -> filament profile and temperatures from the gcode\n"
      ~ "  or FILAMENT=\"EXACT slicer profile name\" NOZZLE=220 BED=60 MATERIAL=PLA\n"
      ~ "BEFORE EVERY PRINT (turn on once, it is kept):\n"
      ~ "  LIDAR_FLOW MODE=1  calibrates new profiles, reuses the saved PA for the others (MODE=2 always, 0 off)\n"
      ~ "  LIDAR_FIRSTLAYER ON=1  checks the first layer (ON_BAD=cancel to cancel)\n"
      ~ "WHICH PA A PRINT USES: with LIDAR_FLOW on always the LiDAR one (it also replaces the gcode's);\n"
      ~ "  with LIDAR_FLOW off: 1) the gcode's, if the slicer has 'Enable pressure advance' on;\n"
      ~ "  2) otherwise the saved one for profile+temperature; 3) otherwise printer.cfg\n"
      ~ "PROFILES: LIDAR_PA_LIST lists, LIDAR_PA_SET PA=0.027 GCODE=\"file.gcode\" sets by hand,\n"
      ~ "  LIDAR_PA_FORGET FILAMENT=\"...\" deletes. Two different filaments = two slicer profiles.\n"
      ~ "MORE: LIDAR_STATUS settings, LIDAR_CANCEL stops everything, LIDAR_LANGUAGE LANG=it")}
  {% endif %}

[gcode_macro LIDAR_STATUS]
description: Show the LiDAR settings (what happens at print start)
gcode:
  {% set v = printer.save_variables.variables %}
  {% set d = printer['gcode_macro _K1LIDAR'].defaults %}
  {% set it = v.lidar_lang|default(d.lidar_lang) == 'it' %}
  {% set fw = v.lidar_flow|default(d.lidar_flow)|int %}
  {% set fl = v.lidar_firstlayer|default(d.lidar_firstlayer)|int %}
  {% set ob = v.lidar_on_bad|default(d.lidar_on_bad) %}
  {% set pa = v.lidar_pa_apply|default(d.lidar_pa_apply)|int %}
  {% set hook = 'gcode_macro sdcard_print_file' in printer.configfile.settings %}
  {% if it %}
    {% set fwt = ['spenta', 'solo profili nuovi', 'sempre'][fw] %}
    {action_respond_info(
      "LiDAR:\n"
      ~ "  taratura PA all'avvio stampa   : " ~ fwt ~ "\n"
      ~ "  controllo primo strato         : " ~ ("ATTIVO (se difettoso: " ~ ("annulla" if ob == 'cancel' else "pausa") ~ ")" if fl else "spento") ~ "\n"
      ~ "  applica il PA salvato del profilo: " ~ ("si" if pa else "no") ~ "\n"
      ~ "  ripiego (se il gcode non lo dice): " ~ v.lidar_material|default('PLA') ~ " "
      ~ (v.lidar_hotend|default(0)|string ~ "/" ~ v.lidar_bed|default(0)|string ~ " C" if v.lidar_hotend|default(0)|int else "preset") ~ "\n"
      ~ ("" if hook else "  ATTENZIONE: hook di avvio stampa NON installato (install.sh --with-hook): le voci sopra non hanno effetto"))}
  {% else %}
    {% set fwt = ['off', 'new profiles only', 'always'][fw] %}
    {action_respond_info(
      "LiDAR:\n"
      ~ "  PA calibration at print start  : " ~ fwt ~ "\n"
      ~ "  first layer check              : " ~ ("ON (when bad: " ~ ob ~ ")" if fl else "off") ~ "\n"
      ~ "  apply the saved PA of the profile: " ~ ("yes" if pa else "no") ~ "\n"
      ~ "  fallback (when the gcode doesn't say): " ~ v.lidar_material|default('PLA') ~ " "
      ~ (v.lidar_hotend|default(0)|string ~ "/" ~ v.lidar_bed|default(0)|string ~ " C" if v.lidar_hotend|default(0)|int else "preset") ~ "\n"
      ~ ("" if hook else "  WARNING: print start hook NOT installed (install.sh --with-hook): the items above have no effect"))}
  {% endif %}

[gcode_macro LIDAR_PA_CALIBRATE]
description: Find the PA of a filament: prints only a small test pattern (X 0-30 mm), ~15 min. Best: GCODE="a file sliced with that filament profile". Or FILAMENT="exact slicer profile name" NOZZLE= BED=
gcode:
  {% if printer.print_stats.state in ('printing', 'paused') %}
    {action_raise_error("LiDAR: print in progress / stampa in corso")}
  {% endif %}
  {% set v = printer.save_variables.variables %}
  {% set gcode = params.GCODE|default('') %}
  {% set filament = params.FILAMENT|default('') %}
  {% set nozzle = params.NOZZLE|default(0 if gcode else v.lidar_hotend|default(0))|int %}
  {% set bed = params.BED|default(0 if gcode else v.lidar_bed|default(0))|int %}
  {% set material = params.MATERIAL|default('')|upper %}
  {% set fine = params.FINE|default(0)|int %}
  {% set start = params.START|default(-1)|float %}
  {% set step = params.STEP|default(0)|float %}
  {% if start != -1 and (start < 0 or start > 0.5) %}
    {action_raise_error("START: 0-0.5")}
  {% endif %}
  {% if step and (step < 0.0005 or step > 0.02) %}
    {action_raise_error("STEP: 0.0005-0.02")}
  {% endif %}
  {% if material and material not in ['PLA', 'PETG', 'ABS', 'TPU', 'ASA'] %}
    {action_raise_error("MATERIAL: PLA, PETG, ABS, TPU, ASA")}
  {% endif %}
  {% if nozzle and (nozzle < 170 or nozzle > 320) %}
    {action_raise_error("NOZZLE %d: 170-320" % nozzle)}
  {% endif %}
  {% if bed and (bed < 40 or bed > 115) %}
    {action_raise_error("BED %d: 40-115" % bed)}
  {% endif %}
  {action_call_remote_method("k1lidar_pa", nozzle=nozzle, bed=bed, filament=filament,
                             material=material, fine=fine, start=start, step=step, gcode=gcode)}
  {action_respond_info("LiDAR PA: %s%s %s/%s C%s%s" % (
                        ("GCODE=" ~ gcode ~ " ") if gcode else "", filament or material or '',
                        nozzle or ('gcode' if gcode else 'preset'), bed or ('gcode' if gcode else 'preset'),
                        " FINE" if fine else "", (" START=%s" % start) if start != -1 else ""))}

[gcode_macro LIDAR_PA_SET]
description: Set the PA of a filament profile by hand, no calibration. PA=0.027 and GCODE="a file sliced with that profile" (or FILAMENT="exact slicer profile name" NOZZLE=220)
gcode:
  {% if 'PA' not in params %}
    {action_raise_error("PA= required / PA= obbligatorio")}
  {% endif %}
  {% set pa = params.PA|float %}
  {% if pa < 0 or pa > 1 %}
    {action_raise_error("PA: 0-1")}
  {% endif %}
  {% set gcode = params.GCODE|default('') %}
  {% set filament = params.FILAMENT|default('') %}
  {% set nozzle = params.NOZZLE|default(0)|int %}
  {% if not gcode and not (filament and nozzle) %}
    {action_raise_error("GCODE=\"file.gcode\" or FILAMENT=\"name\" NOZZLE=220")}
  {% endif %}
  {action_call_remote_method("k1lidar_set", pa=pa, gcode=gcode, filament=filament, nozzle=nozzle)}

[gcode_macro LIDAR_FLOW]
description: PA calibration at print start - MODE=1 calibrate only profiles never measured (then reuse the saved PA), MODE=2 before every print, MODE=0 off
gcode:
  {% set mode = params.MODE|default(1)|int %}
  {% if mode not in [0, 1, 2] %}
    {action_raise_error("MODE: 0, 1, 2")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=lidar_flow VALUE={mode}
  LIDAR_STATUS

[gcode_macro LIDAR_FLOW_ON]
description: PA calibration at print start ON for new filament profiles (same as LIDAR_FLOW MODE=1)
gcode:
  LIDAR_FLOW MODE=1

[gcode_macro LIDAR_FLOW_OFF]
description: PA calibration at print start OFF (the saved PA is still applied, see LIDAR_PA_APPLY)
gcode:
  LIDAR_FLOW MODE=0

[gcode_macro LIDAR_FIRSTLAYER]
description: First layer check at print start - ON=1/0; when the layer is bad ON_BAD=pause (default) or cancel
gcode:
  {% set on = params.ON|default(1)|int %}
  {% set ob = params.ON_BAD|default(printer.save_variables.variables.lidar_on_bad|default('pause'))|lower %}
  {% if ob not in ['pause', 'cancel'] %}
    {action_raise_error("ON_BAD: pause | cancel")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=lidar_firstlayer VALUE={1 if on else 0}
  SAVE_VARIABLE VARIABLE=lidar_on_bad VALUE='"{ob}"'
  LIDAR_STATUS

[gcode_macro LIDAR_FIRSTLAYER_ON]
description: First layer check at print start ON
gcode:
  LIDAR_FIRSTLAYER ON=1

[gcode_macro LIDAR_FIRSTLAYER_OFF]
description: First layer check at print start OFF
gcode:
  LIDAR_FIRSTLAYER ON=0

[gcode_macro LIDAR_PA_APPLY]
description: ON=1 (default) apply the saved PA of the filament profile to every print; ON=0 leave the PA of printer.cfg / of the gcode
gcode:
  SAVE_VARIABLE VARIABLE=lidar_pa_apply VALUE={1 if params.ON|default(1)|int else 0}
  LIDAR_STATUS

[gcode_macro LIDAR_SET_MATERIAL]
description: Fallback material and temperatures, used only when the gcode does not say them (HOTEND/BED 0 = material preset)
gcode:
  {% set mat = params.MATERIAL|default('PLA')|upper %}
  {% if mat not in ['PLA', 'PETG', 'ABS', 'TPU', 'ASA'] %}
    {action_raise_error("MATERIAL: PLA, PETG, ABS, TPU, ASA")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=lidar_material VALUE='"{mat}"'
  {% if 'HOTEND' in params %}
    {% set ho = params.HOTEND|int %}
    {% if ho != 0 and (ho < 170 or ho > 320) %}
      {action_raise_error("HOTEND: 170-320 (0 = preset)")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=lidar_hotend VALUE={ho}
  {% endif %}
  {% if 'BED' in params %}
    {% set be = params.BED|int %}
    {% if be != 0 and (be < 40 or be > 115) %}
      {action_raise_error("BED: 40-115 (0 = preset)")}
    {% endif %}
    SAVE_VARIABLE VARIABLE=lidar_bed VALUE={be}
  {% endif %}
  LIDAR_STATUS

[gcode_macro LIDAR_PA_LIST]
description: List the filament profiles with a saved PA (profile, nozzle temperature, PA, range, date)
gcode:
  {action_call_remote_method("k1lidar_list")}

[gcode_macro LIDAR_PA_FORGET]
description: Delete the saved PA of a filament profile - FILAMENT="profile name" [NOZZLE=220, otherwise every temperature]
gcode:
  {% if 'FILAMENT' not in params %}
    {action_raise_error("FILAMENT=\"name\" required")}
  {% endif %}
  {action_call_remote_method("k1lidar_forget", filament=params.FILAMENT,
                             nozzle=params.NOZZLE|default(0)|int)}

[gcode_macro LIDAR_CANCEL]
description: Stop the running LiDAR job (calibration or print start); laser and heaters are switched off
gcode:
  {action_call_remote_method("k1lidar_cancel")}

[gcode_macro LIDAR_LANGUAGE]
description: Language of the LiDAR messages and of LIDAR_HELP - LANG=en or it
gcode:
  {% set l = params.LANG|default('en')|lower %}
  {% if l not in ['en', 'it'] %}
    {action_raise_error("LANG: en | it")}
  {% endif %}
  SAVE_VARIABLE VARIABLE=lidar_lang VALUE='"{l}"'
  LIDAR_STATUS
