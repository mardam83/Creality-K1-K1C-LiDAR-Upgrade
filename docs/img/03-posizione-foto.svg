<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><title>Posizione delle foto: prima e dopo</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker></defs><rect width="900" height="520" fill="#ffffff"/><text x="450" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937" font-weight="bold" text-anchor="middle">Dove è stata scattata ogni foto?</text><rect x="20" y="60" width="860" height="200" rx="10" fill="#fff7f7" stroke="#b91c1c" stroke-width="1.5"/><text x="40" y="90" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#b91c1c" font-weight="bold" text-anchor="start">Metodo di serie: la posizione si deduce dal NUMERO della foto</text><text x="40" y="135" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start">Si assume</text><line x1="120" y1="130" x2="840" y2="130" stroke="#9ca3af" stroke-width="2"/><line x1="120.0" y1="120" x2="120.0" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="185.45454545454544" y1="120" x2="185.45454545454544" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="250.9090909090909" y1="120" x2="250.9090909090909" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="316.3636363636364" y1="120" x2="316.3636363636364" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="381.8181818181818" y1="120" x2="381.8181818181818" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="447.27272727272725" y1="120" x2="447.27272727272725" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="512.7272727272727" y1="120" x2="512.7272727272727" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="578.1818181818182" y1="120" x2="578.1818181818182" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="643.6363636363636" y1="120" x2="643.6363636363636" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="709.0909090909091" y1="120" x2="709.0909090909091" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="774.5454545454545" y1="120" x2="774.5454545454545" y2="140" stroke="#1f2937" stroke-width="2"/><line x1="840.0" y1="120" x2="840.0" y2="140" stroke="#1f2937" stroke-width="2"/><text x="40" y="205" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start">In realtà</text><line x1="120" y1="200" x2="840" y2="200" stroke="#9ca3af" stroke-width="2"/><line x1="120" y1="190" x2="120" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="163.2" y1="190" x2="163.2" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="228.0" y1="190" x2="228.0" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="278.4" y1="190" x2="278.4" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="364.8" y1="190" x2="364.8" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="444.0" y1="190" x2="444.0" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="516.0" y1="190" x2="516.0" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="595.2" y1="190" x2="595.2" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="660.0" y1="190" x2="660.0" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="717.6" y1="190" x2="717.6" y2="210" stroke="#1f2937" stroke-width="2"/><line x1="739.2" y1="190" x2="739.2" y2="210" stroke="#b91c1c" stroke-width="2"/><line x1="742.8" y1="190" x2="742.8" y2="210" stroke="#b91c1c" stroke-width="2"/><line x1="746.4" y1="190" x2="746.4" y2="210" stroke="#b91c1c" stroke-width="2"/><line x1="750.0" y1="190" x2="750.0" y2="210" stroke="#b91c1c" stroke-width="2"/><line x1="753.6" y1="190" x2="753.6" y2="210" stroke="#b91c1c" stroke-width="2"/><line x1="757.2" y1="190" x2="757.2" y2="210" stroke="#b91c1c" stroke-width="2"/><rect x="728.4" y="180" width="46.800000000000004" height="42" rx="4" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4 3"/><text x="753.6" y="240" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b91c1c" font-weight="normal" text-anchor="middle">foto a testa ferma</text><text x="450" y="165" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">le foto sembrano regolari...</text><text x="450" y="235" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">...ma il loro numero e i tempi cambiano a ogni run</text><rect x="20" y="285" width="860" height="215" rx="10" fill="#f4fbf6" stroke="#15803d" stroke-width="1.5"/><text x="40" y="315" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#15803d" font-weight="bold" text-anchor="start">Il nostro metodo: la posizione si MISURA</text><rect x="40" y="335" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="367.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Ogni foto</text><text x="150.0" y="392.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">ha un'ora precisa</text><rect x="340" y="335" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="367.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Traiettoria reale</text><text x="450.0" y="392.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">pianificata da Klipper</text><rect x="640" y="335" width="200" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="740.0" y="367.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Posizione vera</text><text x="740.0" y="392.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">errore max 0,3 mm</text><line x1="260" y1="370" x2="340" y2="370" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="560" y1="370" x2="640" y2="370" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><text x="450" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">Per ogni punto che serve si prende la foto più vicina.</text><text x="450" y="466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">Non conta più quante foto escono: conta solo dove erano.</text></svg>