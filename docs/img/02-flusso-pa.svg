<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><title>Flusso della taratura PA</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker></defs><rect width="900" height="400" fill="#ffffff"/><text x="450" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937" font-weight="bold" text-anchor="middle">Taratura del PA: cosa succede in ~15 minuti</text><rect x="30" y="70" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="110.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">1  Livellamento</text><text x="150.0" y="135.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">come in fabbrica,</text><text x="150.0" y="152.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">poi scansione</text><text x="150.0" y="169.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">del piatto nudo</text><rect x="330" y="70" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="110.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">2  Stampa pattern</text><text x="450.0" y="135.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">8 righe a zig-zag,</text><text x="450.0" y="152.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">PA diverso</text><text x="450.0" y="169.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">in ogni riga</text><rect x="630" y="70" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="750.0" y="110.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">3  Raffreddamento</text><text x="750.0" y="135.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">l'ugello scende</text><text x="750.0" y="152.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">sotto i 150 °C</text><text x="750.0" y="169.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">(niente colature)</text><rect x="30" y="230" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="150.0" y="270.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">4  Scansione</text><text x="150.0" y="295.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">una passata</text><text x="150.0" y="312.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">continua del</text><text x="150.0" y="329.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">laser sul pattern</text><rect x="330" y="230" width="240" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="270.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">5  Analisi</text><text x="450.0" y="295.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">si misura quanto</text><text x="450.0" y="312.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">materiale c'è</text><text x="450.0" y="329.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">negli angoli</text><rect x="630" y="230" width="240" height="120" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="750.0" y="270.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">6  Risultato</text><text x="750.0" y="295.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">PA con margine</text><text x="750.0" y="312.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">d'errore, salvato</text><text x="750.0" y="329.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">per quel filamento</text><line x1="270" y1="130" x2="330" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="570" y1="130" x2="630" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><path d="M750,190 L750,210 L150,210 L150,230" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="270" y1="290" x2="330" y2="290" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="570" y1="290" x2="630" y2="290" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><text x="450" y="385" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">Avvio: LIDAR_PA_CALIBRATE GCODE="file.gcode" da Fluidd</text></svg>