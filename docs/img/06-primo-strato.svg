<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><title>Flusso del controllo primo strato</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6b7280"/></marker></defs><rect width="900" height="560" fill="#ffffff"/><text x="450" y="34" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937" font-weight="bold" text-anchor="middle">Controllo del primo strato</text><rect x="30" y="65" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="120.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">1  Piatto nudo</text><text x="120.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">scansione dell'area</text><text x="120.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">dell'oggetto</text><rect x="250" y="65" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="340.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">2  Primo strato</text><text x="340.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">si stampa solo</text><text x="340.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">lo strato 1, poi pausa</text><rect x="470" y="65" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="560.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">3  Raffreddamento</text><text x="560.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">ugello freddo e</text><text x="560.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">ventole al massimo</text><rect x="690" y="65" width="180" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="780.0" y="99.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">4  Seconda scansione</text><text x="780.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">stessa traiettoria</text><text x="780.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">della prima</text><line x1="210" y1="110" x2="250" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="430" y1="110" x2="470" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="650" y1="110" x2="690" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><path d="M780,155 L780,185 L450,185 L450,215" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="300" y="215" width="300" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450.0" y="254.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Analizzatore C2</text><text x="450.0" y="279.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">mappa delle altezze allineata al gcode</text><text x="450.0" y="296.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">confronto con lo strato atteso</text><line x1="360" y1="315" x2="170" y2="380" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="450" y1="315" x2="450" y2="380" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><line x1="540" y1="315" x2="730" y2="380" stroke="#6b7280" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="380" width="260" height="100" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="170.0" y="419.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">BUONO</text><text x="170.0" y="444.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">la stampa riprende</text><text x="170.0" y="461.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">da sola</text><rect x="320" y="380" width="260" height="100" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><text x="450.0" y="419.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">INCERTO</text><text x="450.0" y="444.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">dati insufficienti:</text><text x="450.0" y="461.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">non riprende mai da sola</text><rect x="600" y="380" width="260" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="730.0" y="419.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">DIFETTOSO</text><text x="730.0" y="444.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">pausa o annullamento,</text><text x="730.0" y="461.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">con posizione e area in mm²</text><text x="450" y="525" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="middle" font-style="italic">Vengono cercate due cose: materiale che manca e zone sollevate.</text></svg>